name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

  build:
    name: Build (${{ matrix.platform }}-${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
            archive_name: monoshell-windows-x64.zip
          - os: ubuntu-latest
            platform: linux
            arch: x64
            archive_name: monoshell-linux-x64.tar.gz
          - os: macos-latest
            platform: darwin
            arch: arm64
            archive_name: monoshell-darwin-arm64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Pack Single Executable
        run: npm run pack

      - name: Archive Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item release/mono.exe release/monoshell-windows-x64.exe
          Compress-Archive -Path release/mono.exe -DestinationPath release/${{ matrix.archive_name }}

      - name: Archive Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x release/mono
          tar -czvf release/${{ matrix.archive_name }} -C release mono

      - name: Upload Build Artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: monoshell-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/${{ matrix.archive_name }}
            release/monoshell-windows-x64.exe

      - name: Upload Build Artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: monoshell-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/${{ matrix.archive_name }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Generate SHA256 Checksums
        run: |
          cd dist-release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          generate_release_notes: true
          draft: false
          prerelease: false
